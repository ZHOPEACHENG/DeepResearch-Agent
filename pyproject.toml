[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepresearch"
version = "0.1.0"
description = "Academic Deep Research Platform — automated multi-agent research pipeline"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "motor>=3.6.0",
    "elasticsearch[async]>=8.0.0,<9.0.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt==4.3.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "trafilatura>=1.12.0",
    "markdown>=3.6",
    "weasyprint>=62.0",
    "python-multipart>=0.0.9",
    "structlog>=24.4.0",
    "email-validator>=2.3.0",
    "langchain-deepseek>=1.1.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.15.17",
]
