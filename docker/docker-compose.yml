services:
  postgres:
    image: postgres:16-alpine
    container_name: deepresearch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deepresearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research_dev}
      POSTGRES_DB: ${POSTGRES_DB:-deepresearch}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deepresearch} -d ${POSTGRES_DB:-deepresearch}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: deepresearch-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-research_dev}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-deepresearch}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    build:
      context: .
      dockerfile: Dockerfile.elasticsearch
    image: deepresearch-elasticsearch:8.15.0
    container_name: deepresearch-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q -E 'green|yellow'"]
      interval: 15s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: deepresearch-backend
    restart: unless-stopped
    environment:
      # ── Database hosts (use Docker service names, not localhost) ──
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-deepresearch}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-research_dev}
      - POSTGRES_DB=${POSTGRES_DB:-deepresearch}
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_ROOT_USER=${MONGO_ROOT_USER:-admin}
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-research_dev}
      - MONGO_DB=${MONGO_DB:-deepresearch}
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      # ── LLM ──
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - LLM_EMBED_MODEL=${LLM_EMBED_MODEL:-text-embedding-v4}
      - CHAT_MODEL=${CHAT_MODEL:-gpt-4o}
      - SUMMARIZATION_MODEL=${SUMMARIZATION_MODEL:-gpt-4o-mini}
      - BASE_URL=${BASE_URL:-}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - AVAILABLE_MODELS=${AVAILABLE_MODELS:-["gpt-4o","gpt-4o-mini"]}
      # ── API keys (standard env vars consumed by langchain/httpx) ──
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # ── Search ──
      - SEARCH_PROVIDER=${SEARCH_PROVIDER:-tavily}
      - SEARCH_API_KEY=${SEARCH_API_KEY:-}
      # ── JWT ──
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      # ── Application ──
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - BACKEND_PORT=8000
      - MAX_TASK_EXECUTION_SECONDS=${MAX_TASK_EXECUTION_SECONDS:-7200}
      - MAX_CONCURRENT_TASKS_PER_USER=${MAX_CONCURRENT_TASKS_PER_USER:-3}
      - UPLOAD_DIR=${UPLOAD_DIR:-./uploads}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-50}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000"]}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: deepresearch-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  mongo_data:
  es_data:
